version: "3.8"

services:
  tour-management:
    image: tour-management:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      # Database connection string - provide via .env file or environment
      - DB_CONNECTION_STRING=${DB_CONNECTION_STRING:-Server=localhost;Database=tourdb;User Id=sa;Password=YourPassword123;}
      # Azure Blob Storage connection string for file uploads
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING:-}
      # Azure Blob Storage container name
      - AZURE_BLOB_CONTAINER_NAME=${AZURE_BLOB_CONTAINER_NAME:-tour-pics}
    volumes:
      - tour_logs:/inetpub/logs
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "powershell", "-Command",
             "try { $r = Invoke-WebRequest -Uri http://localhost/health -UseBasicParsing -TimeoutSec 5; if ($r.StatusCode -eq 200) { exit 0 } else { exit 1 } } catch { exit 1 }"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 90s

volumes:
  tour_logs:
    driver: local

networks:
  app-network:
    driver: bridge
