apiVersion: apps/v1
kind: Deployment
metadata:
  name: tour-management
  namespace: tour-management
  labels:
    app: tour-management
    version: "1.0"
    environment: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tour-management
  template:
    metadata:
      labels:
        app: tour-management
        version: "1.0"
    spec:
      nodeSelector:
        kubernetes.io/os: windows
      containers:
        - name: tour-management
          image: "{{IMAGE_URI}}"
          ports:
            - containerPort: 80
              protocol: TCP
              name: http
          env:
            # SQL Server connection string - provide via Kubernetes Secret or Azure Key Vault CSI Driver
            - name: DB_CONNECTION_STRING
              value: "{{DB_CONNECTION_STRING}}"
            # Azure Blob Storage connection string for tour image uploads
            - name: AZURE_STORAGE_CONNECTION_STRING
              value: "{{AZURE_STORAGE_CONNECTION_STRING}}"
            # Azure Blob Storage container name
            - name: AZURE_BLOB_CONTAINER_NAME
              value: "{{AZURE_BLOB_CONTAINER_NAME}}"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
      terminationGracePeriodSeconds: 60
